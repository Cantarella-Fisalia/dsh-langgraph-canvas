# langcontour 的 bundle patch —— 把这个插件挂进 DSH 配置树。
#
# - insert：往配置树里添加新的插件行（entry）
# - id：行标识，patch 覆盖时按它定位，需全局唯一（这里与包名一致）
# - name：'langcontour' 解析本包的 package.json 入口 lib/index.js（宿主半侧）
#   声明了 dsh.client 之后，DSH 的模块系统同时把本包扫描为浏览器插件，
#   通过 /plugins/langcontour/client.js 提供给页面。
- insert:
    - id: langcontour
      name: 'langcontour'
